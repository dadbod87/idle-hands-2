name: Optional disposable public-refresh study
on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact accepted main SHA (all required PR/main checks must already pass)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-refresh-study
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: ih2
          POSTGRES_PASSWORD: local-synthetic-only
          POSTGRES_DB: ih2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ih2 -d ih2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.accepted_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main source
        env:
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
        run: |
          set -eu
          test "$(printf '%s' "$ACCEPTED_SHA" | wc -c)" -eq 40
          case "$ACCEPTED_SHA" in *[!0-9a-f]*) exit 1;; esac
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$ACCEPTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare isolated fixture databases
        env:
          IH2_TEST_DATABASE_URL: postgres://ih2:local-synthetic-only@127.0.0.1:5432/ih2_test
        run: node --experimental-strip-types tools/prepare-test-dbs.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture two fixed public-refresh observations (timing misses retained)
        env:
          IH2_LOAD_DATABASE_URL: postgres://ih2:local-synthetic-only@127.0.0.1:5432/ih2_load
          IH2_LOAD_RESET: '1'
          IH2_PG_CONTAINER: ${{ job.services.postgres.id }}
          IH2_PUBLIC_OUT: test-results/public-refresh
        run: |
          set -eu
          for trial in 1 2; do
            IH2_PUBLIC_TRIAL="$trial" node --experimental-strip-types tools/public-refresh.ts
          done
      - name: Preserve complete or incomplete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-refresh-study
          path: test-results/public-refresh/
          retention-days: 7
          if-no-files-found: warn
