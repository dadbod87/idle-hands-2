<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" font-family="Georgia,serif"><title>Candidate garden growth art — unimplemented</title><rect x="2" y="2" width="1196" height="846" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><text x="34" y="58" font-size="38" fill="#343c36">An allotment of one’s own</text><text x="34" y="91" font-size="16" fill="#343c36">Original design concept · Unimplemented crops, timings and art samples. No game save or reward connection.</text><text x="34" y="135" font-size="20" fill="#343c36">A small rented patch before an earned house. The committee has approved having roots.</text><text x="34" y="238" font-size="23" fill="#343c36">Radish with</text><text x="34" y="268" font-size="23" fill="#343c36">ambitions</text><text x="34" y="310" font-size="15" fill="#343c36">30 real minutes proposed</text><text x="34" y="336" font-size="15" fill="#343c36">First sample: 5 real minutes</text><text x="34" y="362" font-size="15" fill="#343c36">Future café ingredient</text><g data-garden-art="radish-0"><rect x="300" y="210" width="186" height="190" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><text x="313" y="238" font-size="15" fill="#343c36">Sow</text><g transform="translate(393 305) scale(1)"><ellipse cx="0" cy="58" rx="49" ry="8" fill="#b69b76"/><path d="M-60 42h120v20H-60Z" fill="#927356" stroke="#343c36" stroke-width="2"/><path d="M-52 52h104" stroke="#c8b08b"/><ellipse cx="-8" cy="39" rx="4" ry="2" fill="#e0c886"/><ellipse cx="10" cy="40" rx="4" ry="2" fill="#e0c886"/></g><text x="314" y="387" font-size="12" fill="#343c36">No mandatory tending</text></g><g data-garden-art="radish-1"><rect x="510" y="210" width="186" height="190" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><text x="523" y="238" font-size="15" fill="#343c36">Sprout</text><g transform="translate(603 305) scale(1)"><ellipse cx="0" cy="58" rx="49" ry="8" fill="#b69b76"/><path d="M-60 42h120v20H-60Z" fill="#927356"