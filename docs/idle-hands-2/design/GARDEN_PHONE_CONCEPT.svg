<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="Georgia,serif"><title>Candidate garden phone flow — unimplemented</title><rect x="2" y="2" width="1196" height="916" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><text x="30" y="55" font-size="35" fill="#343c36">A useful visit, while the bench keeps working</text><text x="30" y="88" font-size="15" fill="#343c36">Phone interaction concept · Unimplemented. Static targets, candidate costs and example timers; not a playable screen.</text><g data-garden-screen="0" transform="translate(30 140)"><rect x="0" y="0" width="360" height="640" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><rect x="0" y="0" width="360" height="78" rx="6" fill="#dfe6ce" stroke="#343c36" stroke-width="2"/><text x="18" y="49" font-size="24" fill="#343c36">Choose a seed</text><g data-ui-target="close"><rect x="294" y="16" width="48" height="48" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><text x="310" y="48" font-size="27" fill="#343c36">×</text></g><text x="18" y="112" font-size="16" fill="#343c36">No kit, house or bench slot needed.</text><rect x="18" y="145" width="324" height="102" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><g transform="translate(62 186) scale(0.38)"><ellipse cx="0" cy="58" rx="49" ry="8" fill="#b69b76"/><path d="M-60 42h120v20H-60Z" fill="#927356" stroke="#343c36" stroke-width="2"/><path d="M-52 52h104" stroke="#c8b08b"/><path d="M0 43V-2" stroke="#526b50" stroke-width="4" fill="none"/><g transform="translate(0 40) scale(1)"><path d="M0-4C-32-8-40-38-27-46C-8-40-3-21 0-4M0-12C28-16 36-44 24-53C9-47 3-32 0-12" fill="#8fa578" stroke="#526b50" stroke-width="2"/><path d="M0-4l-25-34M0-12l23-31" stroke="#526b50" stroke-width="1.5"/></g><path d="M-17 39Q-17 65 0 66Q17 65 17 39Z" fill="#bb7784" stroke="#343c36" stroke-width="2"/><path d="M0 65l-3 7" stroke="#ede3c6" stroke-width="3"/></g><text x="110" y="182" font-size="16" fill="#343c36">Radish with ambitions</text><text x="110" y="211" font-size="12" fill="#343c36">1 starter seed · 30m proposed</text><rect x="18" y="267" width="324" height="102" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><g transform="translate(62 308) scale(0.38)"><ellipse cx="0" cy="58" rx="49" ry="8" fill="#b69b76"/><path d="M-60 42h120v20H-60Z" fill="#927356" stroke="#343c36" stroke-width="2"/><path d="M-52 52h104" stroke="#c8b08b"/><path d="M0 43V-2" stroke="#526b50" stroke-width="4" fill="none"/><g transform="translate(0 40) scale(1)"><path d="M0-4C-32-8-40-38-27-46C-8-40-3-21 0-4M0-12C28-16 36-44 24-53C9-47 3-32 0-12" fill="#8fa578" stroke="#526b50" stroke-width="2"/><path d="M0-4l-25-34M0-12l23-31" stroke="#526b50" stroke-width="1.5"/></g><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(0 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(45 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(90 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(135 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(180 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(225 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(270 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(315 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><circle cx="0" cy="0" r="9" fill="#8b7045"/></g><text x="110" y="304" font-size="16" fill="#343c36">Out-of-office marigold</text><text x="110" y="333" font-size="12" fill="#343c36">1 starter seed · 4h proposed</text><g data-ui-target="concept"><rect x="18" y="412" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="446" font-size="18" fill="#343c36">Preview planting · 1 seed</text></g><g data-ui-target="concept"><rect x="18" y="482" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="516" font-size="18" fill="#343c36">Cancel preview · free</text></g><text x="18" y="579" font-size="14" fill="#343c36">Missing starter seeds can be replaced.</text><text x="18" y="605" font-size="14" fill="#343c36">Starter seeds stay with this garden.</text></g><g data-garden-screen="1" transform="translate(420 140)"><rect x="0" y="0" width="360" height="640" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><rect x="0" y="0" width="360" height="78" rx="6" fill="#dfe6ce" stroke="#343c36" stroke-width="2"/><text x="18" y="49" font-size="24" fill="#343c36">While work grows</text><g data-ui-target="close"><rect x="294" y="16" width="48" height="48" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><text x="310" y="48" font-size="27" fill="#343c36">×</text></g><rect x="18" y="112" width="324" height="56" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><text x="32" y="146" font-size="17" fill="#343c36">Radish · 19m left (example)</text><rect x="18" y="182" width="324" height="56" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><text x="32" y="216" font-size="17" fill="#343c36">Radish · 24m left (example)</text><rect x="18" y="252" width="324" height="56" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><text x="32" y="286" font-size="17" fill="#343c36">Marigold · 3h left (example)</text><g data-ui-target="concept"><rect x="18" y="330" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="364" font-size="18" fill="#343c36">Inspect soil &amp; clear leaves</text></g><g data-ui-target="concept"><rect x="18" y="400" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="434" font-size="18" fill="#343c36">Make marker · 2 field clippings</text></g><g data-ui-target="concept"><rect x="18" y="470" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="504" font-size="18" fill="#343c36">Arrange patch · free</text></g><text x="18" y="572" font-size="15" fill="#343c36">No attendance or weather window.</text><text x="18" y="601" font-size="14" fill="#343c36">More quests still needed when lanes fill.</text></g><g data-garden-screen="2" transform="translate(810 140)"><rect x="0" y="0" width="360" height="640" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><rect x="0" y="0" width="360" height="78" rx="6" fill="#dfe6ce" stroke="#343c36" stroke-width="2"/><text x="18" y="49" font-size="24" fill="#343c36">Harvest &amp; display</text><g data-ui-target="close"><rect x="294" y="16" width="48" height="48" rx="6" fill="#f8f1df" stroke="#343c36" stroke-width="2"/><text x="310" y="48" font-size="27" fill="#343c36">×</text></g><g transform="translate(180 175) scale(1.05)"><ellipse cx="0" cy="58" rx="49" ry="8" fill="#b69b76"/><path d="M-60 42h120v20H-60Z" fill="#927356" stroke="#343c36" stroke-width="2"/><path d="M-52 52h104" stroke="#c8b08b"/><path d="M0 43V-2" stroke="#526b50" stroke-width="4" fill="none"/><g transform="translate(0 40) scale(1)"><path d="M0-4C-32-8-40-38-27-46C-8-40-3-21 0-4M0-12C28-16 36-44 24-53C9-47 3-32 0-12" fill="#8fa578" stroke="#526b50" stroke-width="2"/><path d="M0-4l-25-34M0-12l23-31" stroke="#526b50" stroke-width="1.5"/></g><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(0 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(45 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(90 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(135 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(180 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(225 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(270 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><ellipse cx="0" cy="-12" rx="8" ry="13" transform="rotate(315 0 0)" fill="#d5ac55" stroke="#8b7045" stroke-width="1.5"/><circle cx="0" cy="0" r="9" fill="#8b7045"/></g><text x="38" y="288" font-size="20" fill="#343c36">Marigold ready. It will wait.</text><rect x="18" y="318" width="324" height="76" rx="6" fill="#eee7d1" stroke="#343c36" stroke-width="2"/><text x="32" y="348" font-size="17" fill="#343c36">Flower space: 11 / 12 (example)</text><text x="32" y="375" font-size="15" fill="#343c36">Fast crops cannot fill this slot.</text><g data-ui-target="concept"><rect x="18" y="418" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="452" font-size="18" fill="#343c36">Harvest 1 · return 1 seed</text></g><g data-ui-target="concept"><rect x="18" y="488" width="324" height="56" rx="6" fill="#fff8e8" stroke="#343c36" stroke-width="2"/><text x="32" y="522" font-size="18" fill="#343c36">Choose a town display</text></g><text x="18" y="580" font-size="14" fill="#343c36">Only your chosen display is shared.</text><text x="18" y="606" font-size="14" fill="#343c36">Your private bag stays private.</text></g><text x="30" y="837" font-size="16" fill="#343c36">Concept only: targets are design pixels, not tested touch controls or physical-device proof.</text><text x="30" y="872" font-size="17" fill="#343c36">Gardening must add decisions and expression. Three extra countdowns are not enough activity.</text></svg>
