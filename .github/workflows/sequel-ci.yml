name: Idle Hands 2 regression gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sequel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-build-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run build
      - run: npm run check:plan
      - run: python3 tools/verify-game-skills.py
      - run: git diff --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequel-client-build
          path: dist/
          retention-days: 7
          if-no-files-found: error
  browser-playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - name: Preserve synthetic playtest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequel-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: error
