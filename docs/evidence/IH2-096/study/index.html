<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Hands 2 · The plot thickens</title>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}:root{font-family:Georgia,'Times New Roman',serif;color:#343c36;background:#d7d0bd;--paper:#f8f1df;--ink:#343c36}*{box-sizing:border-box}body{margin:0}button,select,summary{font:700 .9rem Georgia,serif;color:var(--ink);min-height:44px}button,select{border:2px solid var(--ink);border-radius:5px;background:var(--paper);padding:7px 12px}button{cursor:pointer;box-shadow:2px 3px #343c3626}button[aria-pressed=true]{background:#536e58;color:#fff8e6}button:focus-visible,select:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px solid #ad613e;outline-offset:-3px}.shell{min-width:0;min-height:100dvh;display:grid;grid-template-rows:auto auto minmax(240px,1fr) auto;border:2px solid var(--ink);background:var(--paper)}header{padding:10px 16px;border-bottom:2px solid var(--ink);display:flex;gap:16px;justify-content:space-between;align-items:center}h1{font-size:1.45rem;margin:2px 0}.eyebrow{font:.64rem/1.3 'Courier New',monospace;letter-spacing:1px}.disclosure{font-size:.75rem;max-width:35ch;margin:0;line-height:1.35}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #b7ac94}.choice{display:flex;flex-wrap:wrap;gap:6px;min-width:0}.tools label{font-size:.8rem;display:flex;flex-wrap:wrap;min-width:0;max-width:100%;align-items:center;gap:6px}.tools select{max-width:100%;min-width:0}.compare{margin-left:auto;position:relative}.compare summary{cursor:pointer;padding:10px}.compare[open]{flex-basis:100%;margin-left:0}.compare-options{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid #b7ac94;padding:8px 4px}.compare-options label{min-height:44px}.compare-options input{width:22px;height:22px}.viewport{min-width:0;position:relative;min-height:240px;overflow:hidden;background:#c5b28d}canvas{position:absolute;inset:0;max-width:100%;display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;bottom:10px;left:12px;background:#f8f1dfe8;padding:5px 8px;border:1px solid #7b8060;pointer-events:none;font-size:.72rem;max-width:calc(100% - 24px)}footer{border-top:2px solid var(--ink);padding:9px 12px;font-size:.8rem;line-height:1.35;display:flex;gap:12px;justify-content:space-between}footer p{margin:0}.status{font-weight:bold;min-height:2.7em}.footnote{max-width:70ch;color:#59644f}button:disabled{opacity:.6;cursor:default}input{accent-color:#536e58}@media(max-width:650px){header{display:block;padding:7px 10px;gap:7px;align-items:flex-start}header .disclosure{max-width:none;margin-top:4px}h1{font-size:1.2rem}.eyebrow{font-size:.56rem;letter-spacing:.4px}.disclosure{font-size:.65rem;max-width:19ch}.tools{padding:6px;gap:6px}.tools button{font-size:.8rem;padding:7px 9px}.tools label{font-size:.75rem}.compare{margin-left:0}.compare summary{font-size:.8rem;padding:8px}.viewport{min-height:260px}footer{display:block;font-size:.72rem}.footnote{margin-top:4px}.shell{min-height:100dvh;grid-template-rows:auto auto minmax(240px,1fr) auto}}@media(max-height:480px) and (min-width:651px){header{padding:5px 12px}header .eyebrow{display:none}header>div{flex:1;min-width:0}h1{font-size:1.1rem}.disclosure{font-size:.7rem}.tools{padding:5px 10px}.viewport{min-height:180px}footer{padding:5px 10px}.shell{height:auto;grid-template-rows:auto auto minmax(180px,calc(100dvh - 160px)) auto}.footnote{max-width:50ch}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<main class="shell"><header><div><div class="eyebrow">IDLE HANDS 2 · VISUAL STUDY</div><h1>The plot thickens.</h1></div><p class="disclosure">Illustrations only. No planting, spending or saved-game changes.</p></header>
<div class="tools" aria-label="Garden comparison controls"><div class="choice" role="group" aria-label="Compare garden views"><button id="current" aria-pressed="false">Current view</button><button id="proposed" aria-pressed="true">Garden study</button></div><label class="illustration"><span class="sr-only">Illustration</span><select id="stage" aria-label="Illustration"><option value="empty">Empty beds</option><option value="radish-ready">Radishes ready</option><option value="marigold-ready">Marigolds ready</option><option value="mixed">Mixed growth</option></select></label><details class="compare"><summary>Options</summary><div class="compare-options"><label><input type="checkbox" id="layers" checked>Study art</label><label><input type="checkbox" id="framing" checked>Fit the beds</label><label><input type="checkbox" id="boundaries">Show bed boundaries</label><button id="locate">Locate beds</button></div></details></div>
<section class="viewport" aria-label="Garden illustration"><canvas tabindex="0" aria-label="Allotment visual comparison. Drag or use arrow keys to look around. Home locates the beds." aria-describedby="description"></canvas></section>
<footer><p id="description" class="status" role="status">Opening the art study…</p><p class="footnote">Drag to look around · arrow keys and Home also work.</p></footer></main>
<script>



function studyUnion(rects            )          {if(!rects.length)throw new Error('A study needs bounds.');const left=Math.min(...rects.map(r=>r.x)),top=Math.min(...rects.map(r=>r.y));return{x:left,y:top,width:Math.max(...rects.map(r=>r.x+r.width))-left,height:Math.max(...rects.map(r=>r.y+r.height))-top};}
/** Render-only comparison. It never settles, moves or writes a game resident. */
function gardenStudyFrame(view                             ,geometry                    ,mode                     ,pan           ={x:0,y:0}){
 if(![view.width,view.height,geometry.width,geometry.height].every(n=>Number.isFinite(n)&&n>0)||![pan.x,pan.y,geometry.actor.x,geometry.actor.y].every(Number.isFinite))throw new Error('Finite positive study viewport required.');
 const a=geometry.activity,zoom=mode==='current'?1:Math.max(.75,Math.min(1,view.width/(a.width+24),view.height/(a.height+24))),width=view.width/zoom,height=view.height/zoom;
 const focus=mode==='current'?geometry.actor:{x:a.x+a.width/2,y:a.y+a.height/2};
 const clamp=(n       ,extent       ,visible       )=>{const low=-Math.max(0,(visible-extent)/2),high=low+Math.max(extent,visible)-visible;return Math.min(high,Math.max(low,n-visible/2));};
 const scrollX=clamp(focus.x+pan.x,geometry.width,width),scrollY=clamp(focus.y+pan.y,geometry.height,height);
 return{zoom,scrollX,scrollY,width,height,fitsActivity:a.x>=scrollX&&a.y>=scrollY&&a.x+a.width<=scrollX+width&&a.y+a.height<=scrollY+height};
}
function studyProject(rect          ,frame                                    )          {return{x:(rect.x-frame.scrollX)*frame.zoom,y:(rect.y-frame.scrollY)*frame.zoom,width:rect.width*frame.zoom,height:rect.height*frame.zoom};}

const DATA={"classification":"IH2-096 original standalone visual study. No game API, storage, jobs or authority.","width":576,"height":576,"actor":{"x":304,"y":464},"blocked":[{"x":128,"y":256,"width":96,"height":96},{"x":256,"y":256,"width":96,"height":96},{"x":384,"y":256,"width":96,"height":96}],"targets":[{"id":"garden-beds","name":"Your garden beds","rect":{"x":128,"y":240,"width":352,"height":152},"point":{"x":304,"y":432}},{"id":"garden-desk","name":"Allotment attendant","rect":{"x":128,"y":400,"width":80,"height":64},"point":{"x":176,"y":464}},{"id":"garden-exit","name":"Town square","rect":{"x":248,"y":480,"width":80,"height":64},"point":{"x":304,"y":528}}],"activity":{"x":128,"y":256,"width":352,"height":288},"currentBeds":[{"x":176,"y":352},{"x":304,"y":352},{"x":432,"y":352}],"candidateBeds":[{"x":176,"y":352},{"x":304,"y":352},{"x":432,"y":352}],"currentLabels":[[304,384,"Your three beds"],[176,371.2,"Attendant"],[304,531.2,"Square ↓"]],"proposedLabels":[[416,401.6,"Your three beds"],[176,478,"Attendant"],[304,531.2,"Square ↓"]],"coordinateNote":"Actor feet render at (position+0.5)*32. Collision and clickable doorArea rectangles are world-grid edges at value*32, as canStand and Session.point prove. Existing GARDEN_BEDS already align; no crop shift or model change. Earlier half-tile rectangle projection was rejected."};
const canvas=document.querySelector('canvas'),viewport=canvas.parentElement,ctx=canvas.getContext('2d'),status=document.querySelector('#description'),stage=document.querySelector('#stage'),layers=document.querySelector('#layers'),framing=document.querySelector('#framing'),boundaries=document.querySelector('#boundaries');
const images=new Map(),failed=[],state={ready:false,pan:{x:0,y:0},frame:null,view:{width:0,height:0},draws:0};let drag=null;
const names=['garden-ground','garden-attendant','garden-bed-empty','resident-aster','study-meadow-detail',...['radish','marigold'].flatMap(c=>['sow','sprout','growing','ready'].map(s=>'garden-'+c+'-'+s)),...[1,2,3].map(i=>'study-bed-footprint-'+i)];
function image(id){return images.get(id);}function drawImage(id,x,y,w,h){const img=image(id);if(img)ctx.drawImage(img,x,y,w??img.naturalWidth,h??img.naturalHeight);}
function crop(i){return stage.value==='empty'?'garden-bed-empty':stage.value==='mixed'?['garden-radish-sprout','garden-marigold-growing','garden-radish-ready'][i]:'garden-'+stage.value;}
function draw(){
 const r=viewport.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=Math.min(2,devicePixelRatio||1);state.view={width:w,height:h};const geometry={width:DATA.width,height:DATA.height,actor:DATA.actor,activity:DATA.activity},frame=gardenStudyFrame(state.view,geometry,framing.checked?'proposed':'current',state.pan);state.frame=frame;state.draws++;
 const pw=Math.round(w*dpr),ph=Math.round(h*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#c5b28d';ctx.fillRect(0,0,w,h);ctx.save();ctx.scale(frame.zoom,frame.zoom);ctx.translate(-frame.scrollX,-frame.scrollY);drawImage('garden-ground',0,0,576,576);if(layers.checked)drawImage('study-meadow-detail',0,0,576,576);
 const beds=layers.checked?DATA.candidateBeds:DATA.currentBeds;for(const[p,i]of beds.map((p,i)=>[p,i])){if(layers.checked)drawImage('study-bed-footprint-'+(i+1),p.x-48,p.y-96,96,96);drawImage(crop(i),p.x-48,p.y-96,96,112);}
 const people=[{x:5.5*32,y:14.1*32,id:'garden-attendant',atlas:false},{...DATA.actor,id:'resident-aster',atlas:true}].sort((a,b)=>a.y-b.y);for(const p of people){const img=image(p.id);if(img){if(p.atlas)ctx.drawImage(img,0,0,64,80,p.x-32*.9,p.y-72*.9,64*.9,80*.9);else ctx.drawImage(img,p.x-32*.9,p.y-72*.9,64*.9,80*.9);}}
 if(boundaries.checked){ctx.strokeStyle='#a45331';ctx.lineWidth=1.5/frame.zoom;ctx.setLineDash([5/frame.zoom,4/frame.zoom]);for(const b of DATA.blocked)ctx.strokeRect(b.x,b.y,b.width,b.height);ctx.setLineDash([]);}ctx.restore();
 // Keep the existing small place labels readable in screen space during the study fit.
 for(const[x,y,text]of(layers.checked?DATA.proposedLabels:DATA.currentLabels)){const p=studyProject({x,y,width:0,height:0},frame);ctx.font='11px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';const tw=ctx.measureText(text).width;ctx.fillStyle='#f8f1df';ctx.fillRect(p.x-tw/2-4,p.y-8,tw+8,17);ctx.fillStyle='#343c36';ctx.fillText(text,p.x,p.y+.5);}
 const viewName=layers.checked?'Garden study':'Current artwork',cropName=stage.options[stage.selectedIndex].text;status.textContent=failed.length?'Some study artwork could not load.':viewName+' · '+cropName+'.';document.querySelector('#current').setAttribute('aria-pressed',String(!layers.checked&&!framing.checked));document.querySelector('#proposed').setAttribute('aria-pressed',String(layers.checked&&framing.checked));
}
function locate(){state.pan={x:0,y:0};draw();}document.querySelector('#current').onclick=()=>{layers.checked=false;framing.checked=false;locate();};document.querySelector('#proposed').onclick=()=>{layers.checked=true;framing.checked=true;locate();};document.querySelector('#locate').onclick=locate;for(const e of[layers,framing,boundaries])e.onchange=locate;stage.onchange=draw;
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pan:{...state.pan}};canvas.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});};canvas.onpointermove=e=>{if(!drag)return;state.pan={x:drag.pan.x-(e.clientX-drag.x)/state.frame.zoom,y:drag.pan.y-(e.clientY-drag.y)/state.frame.zoom};draw();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onkeydown=e=>{const steps={ArrowLeft:[-40,0],ArrowRight:[40,0],ArrowUp:[0,-40],ArrowDown:[0,40]};if(e.key==='Home'){e.preventDefault();locate();return;}if(steps[e.key]){e.preventDefault();state.pan.x+=steps[e.key][0];state.pan.y+=steps[e.key][1];draw();}};
new ResizeObserver(draw).observe(viewport);window.__gardenStudy=Object.freeze({snapshot:()=>JSON.parse(JSON.stringify({...state,layout:layers.checked?'proposed':'current',framing:framing.checked?'proposed':'current',stage:stage.value,boundaries:boundaries.checked,failed,geometry:DATA,projectedBeds:(layers.checked?DATA.candidateBeds:DATA.currentBeds).map(p=>studyProject({x:p.x-48,y:p.y-96,width:96,height:96},state.frame)),projectedTargets:DATA.targets.map(t=>({id:t.id,...studyProject(t.rect,state.frame)}))}))});
Promise.all(names.map(id=>new Promise(resolve=>{const img=new Image();img.onload=()=>{images.set(id,img);resolve();};img.onerror=()=>{failed.push(id);resolve();};img.src='art/'+id+'.svg';}))).then(()=>{state.ready=true;draw();});draw();
</script></html>
