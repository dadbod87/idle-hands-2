<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside the Glasshouse · Idle Hands 2 design</title>
<style>
 :root { font-family:Georgia,serif; color:#344839; background:#d5cdb9; }
 * { box-sizing:border-box; }
 main { width:min(790px,100% - 16px); margin:8px auto; padding:clamp(10px,3vw,24px); background:#f6ebd4; border:2px solid #344839; border-radius:7px; }
 h1,p { margin:0; }
 h1 { font-size:1.68rem; }
 p { margin:.35rem 0 .75rem; font-size:.88rem; }
 figure { margin:0; }
 .room { position:relative; width:min(576px,100%); margin-inline:auto; }
 .room > .room-art { display:block; width:100%; height:auto; }
 .resident { position:absolute; width:8%; height:auto; transform:translate(-50%,-92%); pointer-events:none; }
 .glint { position:absolute; width:4px; aspect-ratio:1; border-radius:50%; background:#faf1c5; pointer-events:none; }
 .feedback { min-height:3.2rem; margin:.5rem 0; padding:.42rem .55rem; background:#ede1c5; border:1px solid #9c8866; line-height:1.3; }
 .destinations { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
 button { min-height:44px; padding:.35rem .5rem; font:inherit; line-height:1.15; color:#304435; background:#fff4da; border:1px solid #637653; border-radius:5px; cursor:pointer; }
 button:focus-visible { outline:3px solid #965035; outline-offset:2px; }
 button[aria-current="location"] { background:#dce1bd; border-color:#445a45; }
 .arrival-mark { visibility:hidden; margin-inline-end:.28em; }
 [aria-current="location"] .arrival-mark { visibility:visible; }
 #exit { width:100%; margin-top:6px; background:#405c4d; color:#fff4da; }
 .exterior { width:min(296px,100%); height:auto; display:block; margin:.75rem auto; }
 [hidden] { display:none !important; }
 @media(max-height:480px) and (min-width:620px) {
  main { padding:8px; margin:4px auto; }
  #inside { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.6rem; align-items:start; }
  .room { width:min(305px,100%); }
  .feedback { margin-top:0; }
  h1 { font-size:1.26rem; }
 }
</style>
<main>
 <h1>Inside the Glasshouse</h1>
 <p>Design preview · Restored interior</p>
 <div id="inside">
  <figure class="room">
   <img class="room-art" src="glasshouse-room.svg" width="576" height="480" alt="Glass roof and warm stone apron, separate fern and sundew tables with a wide straight aisle from the open door.">
   <img class="resident" id="resident" src="/art/original/employee-south-1.svg" alt="">
  </figure>
  <div>
   <p class="feedback" id="stop-note" role="status" tabindex="-1">Choose a stop. Your resident walks there.</p>
   <nav class="destinations" aria-label="Glasshouse stops"></nav>
   <button id="exit" type="button">Back to Inkwood trail</button>
  </div>
 </div>
 <div id="outside" hidden>
  <img class="exterior" src="../facade/restored.svg" width="148" height="112" alt="Restored Glasshouse from the trail">
  <p class="feedback">You step back onto the Inkwood trail at the Glasshouse door.</p>
  <button id="return" type="button">Enter the Glasshouse</button>
 </div>
</main>
<script type="module" src="./tour.ts"></script>
</html>
