<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip’s post · Idle Hands 2 design study</title><style>
:root{font:16px Georgia,serif;color:#343c36;background:#d8d0bb}*{box-sizing:border-box}body{margin:0}.study{max-width:560px;height:100dvh;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#f8f1df;border:2px solid #343c36}.study-head{background:#dfe8cd;border-bottom:2px solid #343c36;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem}.study-head>div{min-width:0;flex:1}.disclosure{font:.75rem/1.35 'Courier New',monospace;margin:0 0 .3rem}.study-head h1{font-size:1.5rem;line-height:1.1;margin:0}button,select{font:inherit;color:inherit;min-height:44px;border:2px solid #343c36;border-radius:5px;background:#fff8e7;padding:.65rem .75rem;cursor:pointer;box-shadow:2px 3px #b5a88b}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{outline:3px solid #b66d45;outline-offset:1px}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #9f632f;outline-offset:2px}button.primary{background:#a6b88d}#screen{overflow:auto;min-height:0;padding:1rem;scroll-padding:12px}h2{font-size:1.35rem;margin:.1rem 0 .65rem}h3{font-size:1.05rem}p{line-height:1.4;margin:.65rem 0}img{max-width:100%;object-fit:contain}label{display:grid;gap:.5rem;margin:.8rem 0}select{max-width:100%;width:100%}.lead{display:flex;align-items:center;gap:.8rem}.lead img{width:100px;height:84px}.paper{border:1px solid #a79b7e;background:#f0e6cc;padding:.75rem;border-radius:4px}.actions{display:grid;gap:.65rem;margin:.8rem 0}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}.parcel-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.7rem 0}.parcel-list button{min-width:0;height:7rem;padding:.35rem;font-size:.9rem;display:grid;justify-items:center;align-content:center;gap:.3rem}.parcel-list img{width:40px;height:40px}.parcel-list span{min-height:1.2em}.receipt-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;height:5.5rem;margin:.8rem 0}.receipt{border:1px solid #b4aa90;display:grid;justify-items:center;align-content:center;overflow:auto;gap:.2rem;font:.8rem 'Courier New',monospace}.receipt img{width:40px;height:40px}.person-note{min-height:4.5em;overflow:auto;border-left:3px solid #819174;padding:.6rem;background:#e9e5cc}.wide{width:100%}.route-card{width:100%;height:auto;max-height:190px}.route-order{font: .85rem/1.4 'Courier New',monospace;overflow-wrap:anywhere}.motifs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}.motifs button{padding:.4rem;min-width:0;min-height:8rem;display:grid;justify-items:center;align-content:center;gap:.4rem;font-size:.9rem}.motifs img{width:54px;height:76px}.cost{font:1rem/1.4 'Courier New',monospace}.warning{border-left:4px solid #b66d45;padding:.75rem;background:#f4e4bd;min-height:6em;overflow:auto}.sample-label{font:.8rem/1.3 'Courier New',monospace;background:#e3dac1;padding:.5rem}.sample-room{position:relative;background:#c5b28d;max-width:430px;margin:auto}.sample-room>img:first-child{display:block;width:100%;height:auto}.sample-room .furnishing{position:absolute;width:13.8889%;transform:translate(-50%,-94.6429%)}.slots button{min-width:0;font-size:.9rem}.owned-lead img{width:80px;height:112px}.public-card{display:flex;align-items:center;gap:.8rem;background:#e6eddb;border:1px solid #849474;padding:.75rem}.public-card img{width:48px;height:68px}.public-card p{font-size:.9rem;margin:.2rem 0}.quiet{font-size:.85rem;color:#596151}details{margin:.75rem 0}summary{min-height:44px;display:flex;align-items:center;cursor:pointer}#study-status{height:3.75rem;overflow:auto;padding:.6rem 1rem;border-top:2px solid #343c36;background:#e6ead7;line-height:1.3;font-size:.9rem}#screen>h2{scroll-margin:8px}.review-quote{min-height:6em;overflow:auto}ul{padding-left:1.25rem;line-height:1.5}@media(max-height:450px){.study-head{padding:.4rem .75rem}.study-head h1{font-size:1.15rem}.study-head .disclosure{font-size:.7rem}.lead img{width:64px;height:56px}#screen{padding:.6rem .8rem}.motifs button{min-height:6rem}.motifs img{height:52px;width:38px}#study-status{font-size:.75rem;line-height:1.2;padding:.4rem .75rem;height:3.5rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div class="study"><header class="study-head"><div><p class="disclosure">DESIGN STUDY · No game connection</p><h1>Pip’s post</h1></div><button id="reset-study" title="Reset this design example" aria-label="Reset design study">Reset</button></header><main id="screen" tabindex="-1"></main><footer id="study-status" role="status" aria-live="polite" tabindex="0">Design only. No game items, charges or account changes.</footer></div>
<script type="application/json" id="study-data">{"classification":"IH2-069 standalone fictional interaction study. No game API, persistence or authority.","people":[{"id":"clerk","art":"marlow","name":"Marlow","role":"Town clerk","point":{"x":18,"y":24},"parcel":"Marlow · A permit for a form.","reply":"A permit for a form. At last, a form with a future."},{"id":"caretaker","art":"jun","name":"Jun","role":"Grounds caretaker","point":{"x":32,"y":24},"parcel":"Jun · A progress report on grass.","reply":"The grass is growing. Management has asked it to be more specific."},{"id":"carpentry-desk","art":"nella","name":"Nella","role":"Pine workshop","point":{"x":5,"y":35},"parcel":"Nella · A tree’s application for annual leave.","reply":"Annual leave for a tree. I have approved the branching arrangement."}],"captions":{"clerk-caretaker-carpentry-desk":"Administration, vegetation, fabrication. An unusually complete department.","clerk-carpentry-desk-caretaker":"Approved, assembled, then planted. The route has requested an exception.","caretaker-clerk-carpentry-desk":"The grass got the memo first. It is trying to remain grounded.","caretaker-carpentry-desk-clerk":"Fieldwork before paperwork. Please whisper this part.","carpentry-desk-clerk-caretaker":"Measure twice. File once. Water eventually.","carpentry-desk-caretaker-clerk":"Work first. Forms last. Marlow has requested a meeting."},"variants":[{"id":"leaf","name":"Leaf route"},{"id":"sun","name":"Sun route"},{"id":"moth","name":"Night post"}],"cases":[{"name":"Untouched starter pine + first radish","quote":{"stock":{"pine":6,"radish":1,"marigold":0},"option":"pine-and-lunch","affordable":true,"after":{"pine":4,"radish":0,"marigold":0},"beforeEligibility":{"easel":false,"hamper":false,"welcomeRequest":false},"afterEligibility":{"easel":false,"hamper":false,"welcomeRequest":false},"displacedGoals":[],"limits":"Input sufficiency only; actual cooldown, location, tool, jobs and player choice remain separate. Preview spends nothing."}},{"name":"Four pine planned for an easel","quote":{"stock":{"pine":4,"radish":1,"marigold":1},"option":"pine-and-lunch","affordable":true,"after":{"pine":2,"radish":0,"marigold":1},"beforeEligibility":{"easel":true,"hamper":false,"welcomeRequest":true},"afterEligibility":{"easel":false,"hamper":false,"welcomeRequest":false},"displacedGoals":["easel","welcomeRequest"],"limits":"Input sufficiency only; actual cooldown, location, tool, jobs and player choice remain separate. Preview spends nothing."}},{"name":"Ingredients planned for a hamper","quote":{"stock":{"pine":2,"radish":2,"marigold":1},"option":"pine-and-lunch","affordable":true,"after":{"pine":0,"radish":1,"marigold":1},"beforeEligibility":{"easel":false,"hamper":true,"welcomeRequest":true},"afterEligibility":{"easel":false,"hamper":false,"welcomeRequest":true},"displacedGoals":["hamper"],"limits":"Input sufficiency only; actual cooldown, location, tool, jobs and player choice remain separate. Preview spends nothing."}},{"name":"Only one welcome-request radish","quote":{"stock":{"pine":2,"radish":1,"marigold":1},"option":"pine-and-lunch","affordable":true,"after":{"pine":0,"radish":0,"marigold":1},"beforeEligibility":{"easel":false,"hamper":false,"welcomeRequest":true},"afterEligibility":{"easel":false,"hamper":false,"welcomeRequest":false},"displacedGoals":["welcomeRequest"],"limits":"Input sufficiency only; actual cooldown, location, tool, jobs and player choice remain separate. Preview spends nothing."}},{"name":"Empty carried supplies","quote":{"stock":{"pine":0,"radish":0,"marigold":0},"option":"pine-and-lunch","affordable":false,"after":null,"beforeEligibility":{"easel":false,"hamper":false,"welcomeRequest":false},"afterEligibility":{"easel":false,"hamper":false,"welcomeRequest":false},"displacedGoals":[],"limits":"Input sufficiency only; actual cooldown, location, tool, jobs and player choice remain separate. Preview spends nothing."}},{"name":"Full pine and produce","quote":{"stock":{"pine":24,"radish":12,"marigold":12},"option":"pine-and-lunch","affordable":true,"after":{"pine":22,"radish":11,"marigold":12},"beforeEligibility":{"easel":true,"hamper":true,"welcomeRequest":true},"afterEligibility":{"easel":true,"hamper":true,"welcomeRequest":true},"displacedGoals":[],"limits":"Input sufficiency only; actual cooldown, location, tool, jobs and player choice remain separate. Preview spends nothing."}}],"slots":[{"id":"north-west","label":"Near the bench","x":7,"y":8},{"id":"north-middle","label":"Middle wall","x":10,"y":8},{"id":"north-east","label":"Near the window","x":13,"y":8},{"id":"south-west","label":"Left nook","x":7,"y":11},{"id":"south-middle","label":"Middle nook","x":10,"y":11},{"id":"south-east","label":"Right nook","x":13,"y":11}],"goalNames":{"easel":"an easel","hamper":"a hamper","welcomeRequest":"a welcome-bed request"}}</script><script>
const data=JSON.parse(document.querySelector('#study-data').textContent),screen=document.querySelector('#screen'),status=document.querySelector('#study-status');
const fresh=()=>({view:'intro',accepted:false,delivered:[],selected:'clerk',recipient:'clerk',card:false,variant:'leaf',stockCase:0,crafted:false,published:false,placed:null,room:'workshop',open:false});let state=fresh();
const e=(tag,text='',className='')=>{const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n;};
const image=(file,alt='',className='')=>{const n=e('img','',className);n.src='art/'+file+'.svg';n.alt=alt;return n;};
const button=(label,action,id='',className='')=>{const n=e('button',label,className);n.type='button';if(id)n.id=id;n.onclick=action;return n;};
function say(text){status.textContent=text;status.scrollTop=0;}
function show(view,message){state.view=view;render();screen.scrollTop=0;screen.querySelector('h2')?.focus({preventScroll:true});if(message)say(message);}
function heading(text){const h=e('h2',text);h.tabIndex=-1;screen.append(h);}
function actions(...buttons){const n=e('div','','actions');n.append(...buttons);screen.append(n);return n;}
function receiptRow(){const row=e('div','','receipt-row');for(const person of data.people){const cell=e('div','','receipt');cell.dataset.receipt=person.id;cell.tabIndex=0;cell.append(image((state.delivered.includes(person.id)?'receipt-':'parcel-')+person.art),e('span',person.name+' · '+(state.delivered.includes(person.id)?'✓ Received':'○ To deliver')));row.append(cell);}return row;}
function intro(){heading('The post must go somewhere');const lead=e('div','','lead');lead.append(image('pip-work-surface'),e('p','Pip has a circular. The route is also circular. For once, this is intentional.'));screen.append(lead,e('p','Take three clearly addressed parcels to Marlow, Jun and Nella. Return their receipts in any order. Wrong person? The same parcel comes back to you. No fee or deadline.'));
 screen.append(e('p','Free chapter: an illustrated route card and a plan. A physical letterbox is a separate optional craft.','paper'));
 actions(button(state.accepted?'Resume sample deliveries':'Accept sample commission',()=>{state.accepted=true;show('route','Three addressed sample parcels. Bag space is not required.');},'accept-commission','primary'));
 const notes=e('details');notes.append(e('summary','What this study shows'),e('p','This is a standalone design example with fictional stock. It does not connect to the game, move a real character, spend resources or save an account. The later game would use actual walking and recipient interactions.'));screen.append(notes);}
function route(){heading('Three parcels. Actual addresses.');const list=e('div','','parcel-list');for(const person of data.people){const b=button('',()=>{state.selected=person.id;render();document.querySelector('[data-parcel="'+person.id+'"]').focus();});b.dataset.parcel=person.id;b.setAttribute('aria-pressed',String(state.selected===person.id));b.append(image('parcel-'+person.art),e('strong',person.name),e('span',state.delivered.includes(person.id)?'✓ Delivered':'To deliver'));list.append(b);}screen.append(list);
 const selected=data.people.find(p=>p.id===state.selected);screen.append(e('p',selected.parcel,'paper'));const label=e('label','Preview recipient');const select=e('select');select.id='recipient';for(const person of data.people){const option=e('option',person.name+' · '+person.role);option.value=person.id;select.append(option);}select.value=state.recipient;select.onchange=()=>{state.recipient=select.value;render();document.querySelector('#recipient').focus();};label.append(select);screen.append(label);
 const person=data.people.find(p=>p.id===state.recipient);screen.append(e('p',state.delivered.includes(person.id)?person.reply:person.name+' is here. Existing services stay available separately.','person-note'));
 const hand=button('Hand '+selected.name+'’s parcel to '+person.name,event=>{if(state.delivered.includes(state.selected))return;if(state.selected!==state.recipient){say(person.name+' returns the same parcel for '+selected.name+'. Nothing is lost.');return;}state.delivered.push(person.id);render();say('Reply from '+person.name+' received.');if(event.detail===0){const next=data.people.find(p=>!state.delivered.includes(p.id));document.querySelector(next?'[data-parcel="'+next.id+'"]':'#return-to-pip').focus();}else{const note=screen.querySelector('.person-note');note.tabIndex=-1;note.focus({preventScroll:true});}},'handover','primary');hand.disabled=state.delivered.includes(state.selected);screen.append(hand,receiptRow());
 actions(button('Return to Pip',()=>show('card'),'return-to-pip'));}
function card(){heading(state.card?'A route worth filing':'Back at Pip’s post');screen.append(receiptRow());const complete=state.delivered.length===3;screen.append(e('p',complete?'Three receipts. Everything arrived. The town is choosing to regard this as a precedent.':'Receipts: '+state.delivered.length+'/3. Keep the remaining parcels; there is no delivery deadline.'));
 const finish=button(state.card?'Route card already recorded':'Complete sample route · free',event=>{if(!complete||state.card)return;state.card=true;render();say('Route card saved. Letterbox plan ready.');if(event.detail===0)document.querySelector('#open-craft').focus();else screen.querySelector('h2').focus({preventScroll:true});},'complete-route','primary');finish.disabled=!complete||state.card;screen.append(finish);
 if(state.card){screen.append(image('route-card','Illustrated journal route card','route-card'));const order=e('p',state.delivered.map(id=>data.people.find(p=>p.id===id).name).join(' → '),'route-order');order.dataset.routeOrder='';const caption=e('p',data.captions[state.delivered.join('-')]);caption.dataset.routeCaption='';screen.append(order,caption,e('p','Journal card + plan owned. Physical letterbox: '+(state.crafted?'1':'0')+'.','sample-label'));actions(button(state.crafted?'Inspect sample letterbox':'Preview optional letterbox',()=>show(state.crafted?'owned':'craft','Candidate preview only. No game charge.'),'open-craft'));}
 actions(button('Inspect the delivery route',()=>show('route')));}
function craft(){heading('One unreasonably official letterbox');screen.append(e('p','Candidate recipe · 2 pine + 1 harvested radish. No flower, ordinary materials or new timer. This price is not implemented.','paper'));
 const label=e('label','Fictional stock case');const select=e('select');select.id='stock-case';for(const [index,preset]of data.cases.entries()){const o=e('option',preset.name);o.value=String(index);select.append(o);}select.value=String(state.stockCase);select.onchange=()=>{state.stockCase=Number(select.value);render();document.querySelector('#stock-case').focus();};label.append(select);screen.append(label);
 const q=data.cases[state.stockCase].quote;screen.append(e('p',q.stock.pine+' pine · '+q.stock.radish+' radish · '+q.stock.marigold+' marigold','sample-label'));
 const motifs=e('div','','motifs');for(const variant of data.variants){const b=button('',()=>{state.variant=variant.id;render();document.querySelector('[data-motif="'+variant.id+'"]').focus();});b.dataset.motif=variant.id;b.setAttribute('aria-pressed',String(state.variant===variant.id));b.append(image('letterbox-'+variant.id+'-closed'),e('span',variant.name));motifs.append(b);}screen.append(motifs);
 const warning=e('p',!q.affordable?'Not enough carried pine or harvested radish. In the future game, gather or grow them, then return. The free route stays complete.':q.displacedGoals.length?'This choice would use inputs for: '+q.displacedGoals.map(k=>data.goalNames[k]).join(', ')+'. Keep previewing or deliberately make the box.':'Enough sample stock. Two pine still have an eight-hour replenishment opportunity cost; extra output is not granted.','warning');warning.tabIndex=0;screen.append(warning);
 const quote=e('section','','paper review-quote');quote.id='reviewed-quote';quote.tabIndex=-1;quote.append(e('h3','Review the sample craft'),e('p','Spend 2 pine + 1 radish. Receive one '+data.variants.find(v=>v.id===state.variant).name+' letterbox. No production bonus.','cost'),e('p',q.after?'Would leave '+q.after.pine+' pine, '+q.after.radish+' radish and '+q.after.marigold+' marigold.':'Previewing never spends anything.'));screen.append(quote);
 const confirm=button('Make sample letterbox',()=>{if(!state.card||state.crafted||!q.affordable)return;state.crafted=true;show('owned','Sample made. No game purchase.');},'make-letterbox','primary');confirm.disabled=!state.card||state.crafted||!q.affordable;actions(confirm,button('Keep the plan · cancel preview',()=>show('card'),'cancel-craft'));}
function owned(){heading('Yours, with questionable authority');const lead=e('div','','lead owned-lead');lead.append(image('letterbox-'+state.variant+'-'+(state.open?'open':'closed'),'Sample owned letterbox'),e('p','One sample furnishing. Move it or try a motif for free; its original shape stays recognizable.'));screen.append(lead);
 actions(button(state.open?'Preview closed pose':'Preview open pose',()=>{state.open=!state.open;render();},'pose-preview'));
 const motifs=e('div','','columns');for(const variant of data.variants){const b=button(variant.name,()=>{state.variant=variant.id;render();});b.id='owned-motif-'+variant.id;b.dataset.ownedMotif=variant.id;b.setAttribute('aria-pressed',String(state.variant===variant.id));motifs.append(b);}screen.append(motifs);
 screen.append(e('p','Room sketch only · no account, plot or furniture granted.','sample-label'));const room=e('label','Sample room');const select=e('select');select.id='sample-room-selector';for(const [value,label]of [['workshop','Rental workshop sketch'],['home','Imaginary owned-home sketch']]){const o=e('option',label);o.value=value;select.append(o);}select.value=state.room;select.onchange=()=>{state.room=select.value;render();};room.append(select);screen.append(room);
 const sketch=e('div','','sample-room');sketch.append(image('sample-room','Illustrative room, not a live account'));if(state.placed!==null){const slot=data.slots[state.placed],box=image('letterbox-'+state.variant+'-closed','One placed sample letterbox','furnishing');box.style.left=((slot.x+.5)*32/576*100)+'%';box.style.top=((slot.y+.5)*32/512*100)+'%';sketch.append(box);}screen.append(sketch);
 const slots=e('div','','columns slots');for(const[index,slot]of data.slots.entries()){const b=button(slot.label,()=>{state.placed=index;render();say('Moved the same sample letterbox to '+slot.label.toLowerCase()+'. No extra copy.');});b.id='place-slot-'+index;b.dataset.place=String(index);b.setAttribute('aria-pressed',String(state.placed===index));slots.append(b);}screen.append(slots);
 actions(button('Store sample letterbox',()=>{state.placed=null;render();},'store-letterbox'));
 screen.append(e('h3','A style others could see'),e('p','Share a style illustration at Pip’s register. Your delivery log and supplies stay private. This does not create another furnishing.'));
 actions(button(state.published?'Remove sample style':'Show my sample style',()=>{state.published=!state.published;render();say(state.published?'Only the sample name and motif are shown. The same owned furnishing stays yours.':'Sample style removed. Your item and placement remain.');},'publish-style'));
 if(state.published){const sample=e('section','','public-card');sample.id='public-style';sample.append(image('letterbox-'+state.variant+'-closed'));const words=e('div');words.append(e('strong','Example resident'),e('p',data.variants.find(v=>v.id===state.variant).name),e('p','Style illustration'));sample.append(words);screen.append(sample);}
 const count=e('p','Sample letterboxes owned: 1 · placed: '+(state.placed===null?0:1)+' · public style samples: '+(state.published?1:0),'sample-label');count.id='ownership-summary';screen.append(count,e('p','Decorative NPC-post theme. This study does not provide player messaging or a private inbox.','quiet'));actions(button('Read the route card',()=>show('card')));}
function render(){const active=document.activeElement,top=screen.scrollTop,key=active?.id;screen.replaceChildren();({intro,route,card,craft,owned}[state.view])();screen.scrollTop=top;if(key){const target=document.getElementById(key);if(target&&!target.disabled)target.focus({preventScroll:true});}}
document.querySelector('#reset-study').onclick=()=>{state=fresh();render();screen.scrollTop=0;say('Design example reset. No game progress was changed.');};
render();
</script></body></html>
