<text x="30" y="818" font-size="20" font-weight="bold" fill="#343c36">Identity before animation</text>
<text x="30" y="846" font-size="15" font-weight="normal" fill="#343c36">Preview appearance, name and flavor.</text><text x="30" y="869" font-size="15" font-weight="normal" fill="#343c36">Confirm once; waking presents saved state.</text><text x="30" y="892" font-size="15" font-weight="normal" fill="#343c36">Starting lodging is not house ownership.</text>
<text x="420" y="818" font-size="20" font-weight="bold" fill="#343c36">Keep the encounter readable</text>
<text x="420" y="846" font-size="15" font-weight="normal" fill="#343c36">Health, a tell and retreat stay visible.</text><text x="420" y="869" font-size="15" font-weight="normal" fill="#343c36">Optional marked pocket; safe route remains.</text><text x="420" y="892" font-size="15" font-weight="normal" fill="#343c36">Damage and loot need server receipts.</text>
<text x="810" y="818" font-size="20" font-weight="bold" fill="#343c36">Journal outlives the bubble</text>
<text x="810" y="846" font-size="15" font-weight="normal" fill="#343c36">One drawer; typing pauses movement keys.</text><text x="810" y="869" font-size="15" font-weight="normal" fill="#343c36">30-minute recovery is only a candidate.</text><text x="810" y="892" font-size="15" font-weight="normal" fill="#343c36">Private messages never appear overhead.</text>
<text x="30" y="932" font-size="15" font-weight="normal" fill="#343c36">360 × 640 concept interiors · action targets ≥44 design px · real-device, short-view and200% testing still required.</text>
